<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Вопросникус</title>


    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="border-bottom">
        <nav class="navbar bg-body-tertiary">
            <div class="container gap-3">

                <a class="navbar-brand" href="./index.html">
                    Вопросникус
                </a>

                <form class="d-flex flex-grow-1 gap-2" role="search">
                    <input class="form-control" type="search" name="s" placeholder="Поиск">
                    <button class="btn btn-success" type="submit">
                        Найти
                    </button>
                </form>

                <a class="btn btn-outline-primary" href="./ask.html">
                    Спросить
                </a>

                <div class="d-flex align-items-center gap-2">
                    <img class="account-avatar" src="./static/img/account.jpg">

                    <div>
                        <span class="d-block">Шебордаев А.</span>

                        <div class="d-flex gap-2 mt-1">
                            <a class="btn btn-sm btn-outline-secondary" href="/settings">
                                Настройки
                            </a>

                            <button class="btn btn-sm btn-danger" type="button">
                                Выход
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </nav>
    </header>


    <main class="flex-grow-1">
        <div class="container ">
            <div class="row mt-3 justify-content-between">

                <div class="new-question flex-column col-6">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Заголовок</label>
                            <input type="text" class="form-control" placeholder="Ваш вопрос кратко">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Вопрос</label>
                            <textarea class="form-control new-question-text"
                                placeholder="Ваш вопрос подробно"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Теги</label>
                            <input type="text" class="form-control" placeholder="...">
                        </div>
                        <button type="submit" class="btn btn-primary">Задать вопрос</button>
                    </form>

                </div>

                <aside class="d-flex flex-column gap-5 col-2 ">

                    <div>
                        <h2>Теги</h2>
                        <div class="tags d-flex flex-wrap row-gap-2 column-gap-2">
                            <a href="">Непонимание</a>
                            <a href="">ДЗЖоское</a>
                            <a href="">ДЗ</a>
                            <a href="">АнанасовыйСироп</a>
                            <a href="">Шутеечки</a>
                            <a href="">Анекдоты</a>

                        </div>

                    </div>
                    <div>
                        <h2>Участники</h2>
                        <div class="members d-flex flex-wrap row-gap-2 column-gap-2">
                            <a href="">Артемка</a>
                            <a href="">Никитка</a>
                            <a href="">Tagooci</a>
                            <a href="">Tagooc</a>
                            <a href="">Oochov</a>
                            <a href="">Sheband0</a>

                        </div>
                    </div>
                </aside>
            </div>
        </div>

    </main>

    <footer>

    </footer>

</body>
<script src="static/js/bootstrap.bundle.min.js"></script>

</html>
