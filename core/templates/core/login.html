{% extends 'core/layout/base.html' %}

{% block content %}
<form method="post" action="{% url 'core:login' %}" class="d-flex flex-column gap-2 auth">
    {% csrf_token %}
    <h1>Вход</h1>
    <div class="mb-3 row">
        <label for="username" class="col-sm-2 col-form-label">Логин</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="username" name="username"
                   autocomplete="username" autofocus>
        </div>
    </div>
    <div class="mb-3 row">
        <label for="password" class="col-sm-2 col-form-label">Пароль</label>
        <div class="col-sm-10">
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
        </div>
    </div>
    <button type="submit" class="btn btn-success">Войти</button>
    <a class="btn btn-outline-secondary" href="{% url 'core:signup' %}">Создать новый аккаунт</a>
</form>
{% endblock %}
