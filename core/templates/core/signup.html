{% extends 'core/layout/base.html' %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="d-flex flex-column gap-2 auth">
    {% csrf_token %}
<h1>Регистрация</h1>

<div class="mb-3 row">
    <label for="email" class="col-sm-2 col-form-label">Почта</label>
    <div class="col-sm-10">
        <input type="email" class="form-control" placeholder="email@example.com" id="email" name="email">
    </div>
</div>
<div class="mb-3 row">
    <label for="login" class="col-sm-2 col-form-label">Логин</label>
    <div class="col-sm-10">
        <input type="text" class="form-control" id="login" name="login">
    </div>
</div>
<div class="mb-3 row">
    <label for="display_name" class="col-sm-2 col-form-label">Имя пользователя</label>
    <div class="col-sm-10">
        <input type="text" class="form-control" id="display_name" name="display_name">
    </div>
</div>

<div class="mb-3 row">
    <label for="password" class="col-sm-2 col-form-label">Пароль</label>
    <div class="col-sm-10">
        <input type="password" class="form-control" id="password" name="password">
    </div>
</div>
<div class="mb-3 row">
    <label for="password_repeat" class="col-sm-2 col-form-label">Пароль еще раз</label>
    <div class="col-sm-10">
        <input type="password" class="form-control" id="password_repeat" name="password_repeat">
    </div>
</div>
<div class="mb-3 row">
    <label for="avatar" class="col-sm-2 col-form-label">Аватарка</label>
    <div class="col-sm-10">
        <input class="form-control" type="file" id="avatar" name="avatar">
    </div>
</div>

<button type="submit" class="btn btn-success">Зарегистрироваться</button>
</form>
{% endblock %}
