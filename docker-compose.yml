services:
  web:
    build: .
    command: ["sh", "-c", "python manage.py collectstatic --noinput && exec python manage.py runserver 0.0.0.0:8000"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
      - collected_static:/app/static

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - collected_static:/srv/static:ro

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.docker}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  collected_static:
  media:
  postgres_data:
